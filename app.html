<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<!--
  iPhone 출시일에 바꿀 곳(한 번에 모두 바꾼다 — JS 를 안 돌리는 공유 미리보기·크롤러는 HTML 그대로를 읽는다):
  1) 아래 description · og:description 의 «준비 중» 문구를 «App Store에서도 받을 수 있어요»로
  2) id="ios" 링크의 hidden 속성 삭제
  3) id="ios-soon" 문단에 hidden 속성 추가
  4) 스크립트의 IOS_LIVE = true
-->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>만나 앱 받기</title>
<meta name="description" content="만나 - 가치관으로 알아가는 소개팅 앱. Android는 Google Play에서 받을 수 있고, iPhone 버전도 준비 중이에요." />
<link rel="canonical" href="https://blackdot0525-stack.github.io/manna-legal/app.html" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="theme-color" content="#6a3350" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="ko_KR" />
<meta property="og:site_name" content="만나" />
<meta property="og:title" content="만나 앱 받기" />
<meta property="og:description" content="사진에서 시작해 가치관으로 알아가는 소개팅 앱. Android는 Google Play, iPhone은 App Store(준비 중)." />
<meta property="og:url" content="https://blackdot0525-stack.github.io/manna-legal/app.html" />
<meta property="og:image" content="https://blackdot0525-stack.github.io/manna-legal/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="만나 앱 받기 — 사진과 가치관으로 알아가는 소개팅 앱" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://blackdot0525-stack.github.io/manna-legal/og-image.png" />
<style>
  :root { --bg: #f7f2ec; --surface: #fffdfa; --text: #2b2228; --muted: #6f6168; --primary: #65324f; --on-primary: #ffffff; --border: #e6dcd3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17131a; --surface: #211b24; --text: #f4ecef; --muted: #b9aab3; --primary: #c98aab; --on-primary: #1a1318; --border: #3a3040; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
         background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { width: 100%; max-width: 380px; text-align: center; background: var(--surface); border: 1px solid var(--border);
         border-radius: 28px; padding: 36px 24px 28px; }
  img { width: 112px; height: 112px; border-radius: 26px; }
  h1 { margin: 18px 0 6px; font-size: 26px; }
  p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 15px; }
  .cta { display: block; margin-top: 26px; padding: 16px 20px; border-radius: 999px; background: var(--primary); color: var(--on-primary);
         font-size: 17px; font-weight: 700; text-decoration: none; min-height: 48px; }
  .cta.secondary { margin-top: 12px; background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
  .soon { margin-top: 12px; padding: 14px 16px; border-radius: 16px; border: 1px dashed var(--border); font-size: 14px; }
  [hidden] { display: none !important; }
  .alt { display: inline-block; margin-top: 14px; color: var(--muted); font-size: 14px; }
  .hint { margin-top: 22px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <img src="./icon-512.png" alt="만나" />
  <h1>만나</h1>
  <p>사진에서 시작해 가치관으로 알아가는 소개팅 앱.<br />서로 관심이 닿으면 대화는 무료예요.</p>
  <a class="cta" id="get" href="https://play.google.com/store/apps/details?id=kr.manna.app">Google Play에서 받기</a>
  <a class="cta secondary" id="ios" href="https://apps.apple.com/kr/app/id6824235132" hidden>App Store에서 받기</a>
  <p class="soon" id="ios-soon">iPhone 버전은 준비 중이에요. App Store에 나오면 이 페이지에서 바로 받을 수 있어요.</p>
  <a class="alt" id="web" href="https://play.google.com/store/apps/details?id=kr.manna.app">웹에서 스토어 열기</a>
  <p class="hint" id="hint">버튼이 열리지 않으면 오른쪽 위 메뉴에서<br />«브라우저에서 열기»를 눌러 주세요.</p>
</main>
<script>
  // iPhone 버전 공개 스위치. App Store 에 나오는 날 true 로 바꾼다(앱 ID 6824235132, 앱 레코드는 2026-10-18 생성).
  // false 인 동안 iPhone 방문자에게는 «준비 중»을 말하고, 없는 App Store 페이지로 보내지 않는다.
  var IOS_LIVE = false;
  var APP_STORE = "https://apps.apple.com/kr/app/id6824235132";
  (function () {
    var ua = navigator.userAgent || "";
    var iOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && "ontouchend" in document);
    var android = /Android/i.test(ua);
    var crawler = /bot|crawler|spider|facebookexternalhit|facebot|kakaotalk-scrap/i.test(ua);
    var get = document.getElementById("get"), ios = document.getElementById("ios"), soon = document.getElementById("ios-soon"), web = document.getElementById("web");
    if (IOS_LIVE) { ios.hidden = false; soon.hidden = true; }
    if (iOS) {
      // iPhone 에서는 Google Play 를 앞에 두지 않는다.
      get.hidden = true; web.hidden = true;
      if (!IOS_LIVE) document.getElementById("hint").hidden = true;
      if (IOS_LIVE) { ios.className = "cta"; web.href = APP_STORE; web.hidden = false; }
      if (IOS_LIVE && !crawler) { try { window.location.replace(APP_STORE); } catch (_) {} }
      return;
    }
    if (android) { soon.hidden = true; ios.hidden = true; }
  })();

  // 집결 /app 과 같은 방식(인스타그램 안 브라우저에서도 동작이 확인된 방식).
  // 페이지가 열리면 바로 앱을 연다: 앱이 있으면 실행, 없으면 Android 가 Play 스토어 설치 화면으로 보낸다
  // (package 를 지정한 intent). 자동 이동이 막히면 같은 목적지가 버튼에 남는다(탭 한 번).
  (function () {
    var ua = navigator.userAgent || "";
    var crawler = /bot|crawler|spider|facebookexternalhit|facebot|kakaotalk-scrap/i.test(ua);
    if (!/Android/i.test(ua) || crawler) return;
    var play = "https://play.google.com/store/apps/details?id=kr.manna.app";
    var target = "intent://#Intent;scheme=manna;package=kr.manna.app;S.browser_fallback_url=" + encodeURIComponent(play) + ";end";
    document.getElementById("get").href = target;
    try {
      // replace: 뒤로 가기가 이 자동 이동을 다시 밟지 않게.
      window.location.replace(target);
    } catch (_) {
      // 막히면 버튼으로 이어 간다.
    }
  })();
</script>
</body>
</html>
