<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>만나 앱 받기</title>
<meta name="description" content="만나 - 가치관으로 알아가는 소개팅 앱. Google Play에서 받을 수 있어요." />
<link rel="canonical" href="https://blackdot0525-stack.github.io/manna-legal/app.html" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="ko_KR" />
<meta property="og:site_name" content="만나" />
<meta property="og:title" content="만나 앱 받기" />
<meta property="og:description" content="사진에서 시작해 가치관으로 알아가는 소개팅 앱. Google Play에서 받을 수 있어요." />
<meta property="og:url" content="https://blackdot0525-stack.github.io/manna-legal/app.html" />
<meta property="og:image" content="https://blackdot0525-stack.github.io/manna-legal/icon-512.png" />
<style>
  :root { --bg: #f7f2ec; --surface: #fffdfa; --text: #2b2228; --muted: #6f6168; --primary: #65324f; --on-primary: #ffffff; --border: #e6dcd3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17131a; --surface: #211b24; --text: #f4ecef; --muted: #b9aab3; --primary: #c98aab; --on-primary: #1a1318; --border: #3a3040; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
         background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { width: 100%; max-width: 380px; text-align: center; background: var(--surface); border: 1px solid var(--border);
         border-radius: 28px; padding: 36px 24px 28px; }
  img { width: 112px; height: 112px; border-radius: 26px; }
  h1 { margin: 18px 0 6px; font-size: 26px; }
  p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 15px; }
  .cta { display: block; margin-top: 26px; padding: 16px 20px; border-radius: 999px; background: var(--primary); color: var(--on-primary);
         font-size: 17px; font-weight: 700; text-decoration: none; min-height: 48px; }
  .alt { display: inline-block; margin-top: 14px; color: var(--muted); font-size: 14px; }
  .hint { margin-top: 22px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <img src="./icon-512.png" alt="만나" />
  <h1>만나</h1>
  <p>사진에서 시작해 가치관으로 알아가는 소개팅 앱.<br />서로 관심이 닿으면 대화는 무료예요.</p>
  <a class="cta" id="get" href="https://play.google.com/store/apps/details?id=kr.manna.app">Google Play에서 받기</a>
  <a class="alt" href="https://play.google.com/store/apps/details?id=kr.manna.app">웹에서 스토어 열기</a>
  <p class="hint">버튼이 열리지 않으면 오른쪽 위 ⋮ 메뉴에서<br />«브라우저에서 열기»를 눌러 주세요.</p>
</main>
<script>
  // 집결 /app 과 같은 방식(인스타그램 안 브라우저에서도 동작이 확인된 방식).
  // 페이지가 열리면 바로 앱을 연다: 앱이 있으면 실행, 없으면 Android 가 Play 스토어 설치 화면으로 보낸다
  // (package 를 지정한 intent). 자동 이동이 막히면 같은 목적지가 버튼에 남는다(탭 한 번).
  (function () {
    var ua = navigator.userAgent || "";
    var crawler = /bot|crawler|spider|facebookexternalhit|facebot|kakaotalk-scrap/i.test(ua);
    if (!/Android/i.test(ua) || crawler) return;
    var play = "https://play.google.com/store/apps/details?id=kr.manna.app";
    var target = "intent://#Intent;scheme=manna;package=kr.manna.app;S.browser_fallback_url=" + encodeURIComponent(play) + ";end";
    document.getElementById("get").href = target;
    try {
      // replace: 뒤로 가기가 이 자동 이동을 다시 밟지 않게.
      window.location.replace(target);
    } catch (_) {
      // 막히면 버튼으로 이어 간다.
    }
  })();
</script>
</body>
</html>
